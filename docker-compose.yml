# Local development stack for the Apex Digital Lab platform.
# MongoDB + Redis + Mailpit are enough to run the app locally;
# api/web services are provided for a full containerized run.
services:
  mongo:
    image: mongo:7
    container_name: dental-mongo
    restart: unless-stopped
    # A single-node replica set: MongoDB only allows the multi-document
    # transactions the app uses (case+history, invoice+line-items, reference
    # numbering) on a replica set, never a standalone mongod.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ./docker/data/mongo:/data/db
    healthcheck:
      # Initiate the replica set on first check, then report primary status.
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --port 27017 --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/data/redis:/data

  # Local SMTP catcher — view sent emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: dental-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: dental-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/dental?directConnection=true
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: dental-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    profiles: ["full"]

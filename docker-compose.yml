# Local development stack for the Dental Lab platform.
# Postgres + Redis + Mailpit are enough to run the app locally;
# api/web services are provided for a full containerized run.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/data/redis:/data

  # Local SMTP catcher — view sent emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: dental-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: dental-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: dental-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    profiles: ["full"]

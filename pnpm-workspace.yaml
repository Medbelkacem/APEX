packages:
  - "apps/*"
  - "packages/*"

# Build-script allow-list. mongodb-memory-server's postinstall pre-downloads the
# mongod binary the e2e suite (and `pnpm db:local`) run against. The others are
# optional accelerators that fall back to pure JS, so they stay disabled.
allowBuilds:
  mongodb-memory-server: true
  # Vitest runs the web test suite through esbuild; without its postinstall the
  # platform binary is never unpacked and every run fails to start.
  esbuild: true
  "@nestjs/core": false
  msgpackr-extract: false
  unrs-resolver: false

# Transitive packages the registry flags, pinned to their patched release
# within the same major so nothing that depends on them notices. Runtime ones
# first; the rest are tooling that never reaches a shipped image.
overrides:
  "multer": "^2.3.0"
  "body-parser@1": "^1.20.6"
  "qs": "^6.16.0"
  "lodash": "^4.17.24"
  "js-yaml@4": "^4.3.1"
  "js-yaml@3": "^3.15.1"
  "nanoid@3": "^3.3.18"
  "browserslist": "^4.28.7"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "brace-expansion@5": "^5.0.9"
  "postcss@8": "^8.5.23"
  "uuid@11": "^11.1.1"
  "picomatch@4": "^4.0.7"
  "tmp": "^0.2.7"
  "fast-uri@3": "^3.1.6"
  "glob@10": "^10.5.0"
  "ajv@8": "^8.18.0"
  "webpack@5": "^5.104.1"

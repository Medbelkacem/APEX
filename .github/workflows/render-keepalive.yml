name: Render keep-alive

# Render's free plan spins the API down after 15 minutes idle, and the next
# request pays a ~50s cold start. Pinging /api/health often enough keeps an
# instance warm so a dentist submitting a form never eats that cost.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' -m 55 https://apex-dm9i.onrender.com/api/health || echo "000")
          echo "HTTP $status"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$status" != "200" ]; then
            echo "::warning::Render health check returned $status instead of 200"
          fi

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    # No service containers: the API's database is MongoDB, not Postgres, and
    # both the unit and e2e suites run against mongodb-memory-server (an
    # in-memory replica set the e2e suite's globalSetup starts itself — see
    # apps/api/test/globalSetup.ts). Nothing external — no Mongo, no Redis —
    # is needed to run this job.
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-value-please-change
      MAIL_DRIVER: log

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: End-to-end tests
        run: pnpm --filter @dental/api test:e2e

      - name: Build
        run: pnpm build
